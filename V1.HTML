
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>DeutschQuest — Gjermanisht për Kundenservice</title>

<style>
:root {
  --green: #58a832;
  --green-dark: #397d21;
  --green-soft: #eff7e9;
  --ink: #243449;
  --muted: #718096;
  --border: #e4e9ee;
  --bg: #f7f9fc;
  --blue: #287ac8;
  --blue-soft: #edf5ff;
  --red: #bd424b;
  --red-soft: #fff1f1;
  --white: #fff;
  --radius: 17px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #76b9fa;
  outline-offset: 3px;
}
button:disabled { cursor: default; opacity: .65; }
.hidden { display: none !important; }
.topbar {
  height: 70px;
  padding: 0 24px;
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 21px;
  font-weight: 850;
  letter-spacing: -.6px;
  color: var(--green-dark);
}
.brand-mark {
  width: 39px;
  height: 39px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--green);
  color: white;
  font-size: 23px;
}
.header-note { color: var(--muted); font-size: 13px; }
.app-layout {
  max-width: 1240px;
  margin: auto;
  padding: 28px 22px 60px;
  display: grid;
  grid-template-columns: 220px minmax(0, 740px);
  gap: 30px;
  justify-content: center;
}
.sidebar {
  align-self: start;
  position: sticky;
  top: 94px;
}
.nav-label {
  padding: 0 12px;
  margin: 10px 0 9px;
  color: #98a3b1;
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 1.2px;
}
.nav-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 13px;
  padding: 13px 12px;
  color: #617084;
  font-weight: 750;
  margin-bottom: 5px;
}
.nav-btn .nav-icon { font-size: 21px; width: 26px; text-align: center; }
.nav-btn.active {
  background: var(--green-soft);
  border-color: #d8e9ce;
  color: var(--green-dark);
}
.nav-btn:hover { background: #f0f4ed; }
.sidebar-note {
  margin-top: 24px;
  padding: 17px;
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.sidebar-note strong { font-size: 13px; }
.sidebar-note p { font-size: 12px; color: var(--muted); margin-bottom: 0; }
main { min-width: 0; }
.hero {
  border: 1px solid #dcebd4;
  background: linear-gradient(135deg, #f1f8ec, #f9fcf6);
  border-radius: 23px;
  padding: 30px;
  margin-bottom: 28px;
}
.eyebrow {
  color: var(--green-dark);
  font-size: 11px;
  letter-spacing: 1.4px;
  font-weight: 850;
  text-transform: uppercase;
}
.hero h1 {
  font-size: clamp(28px, 4vw, 39px);
  line-height: 1.18;
  letter-spacing: -1.1px;
  margin: 12px 0;
}
.hero p { color: #61715d; max-width: 520px; }
.hero-bottom {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 22px;
  flex-wrap: wrap;
}
.hero-caption { font-size: 12px; color: var(--muted); }
.primary, .secondary, .outline {
  border-radius: 12px;
  padding: 12px 17px;
  font-weight: 800;
  transition: background .15s, transform .15s;
}
.primary {
  color: white;
  background: var(--green);
  border: 1px solid var(--green);
}
.primary:hover { background: var(--green-dark); }
.secondary {
  color: var(--green-dark);
  background: var(--green-soft);
  border: 1px solid #d7e8cd;
}
.outline {
  color: var(--ink);
  background: white;
  border: 1px solid var(--border);
}
.primary:active, .secondary:active { transform: translateY(1px); }
.full { width: 100%; }
.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin: 25px 0 14px;
}
.section-heading h2 { margin: 0; font-size: 21px; letter-spacing: -.4px; }
.section-heading p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.pill {
  display: inline-block;
  border-radius: 7px;
  padding: 4px 8px;
  background: #edf2f7;
  color: #52657a;
  font-size: 11px;
  font-weight: 850;
}
.module-list { display: grid; gap: 12px; }
.module-card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 15px;
  text-align: left;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: white;
  color: var(--ink);
}
.module-card:hover { border-color: #b7d6a6; box-shadow: 0 3px 12px #23344a08; }
.module-icon {
  flex: 0 0 52px;
  height: 52px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 25px;
}
.module-info { flex: 1; min-width: 0; }
.module-info strong { display: block; font-size: 15px; }
.module-info p { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.module-meta {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 9px;
}
.module-arrow { font-size: 23px; color: #a2adba; }
.info-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 25px 0;
}
.info-tile {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 16px;
}
.info-tile span { font-size: 23px; }
.info-tile strong { display: block; font-size: 13px; margin-top: 8px; }
.info-tile p { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.page-heading { margin: 5px 0 22px; }
.page-heading h1 { margin: 8px 0; font-size: 29px; letter-spacing: -.7px; }
.page-heading p { color: var(--muted); margin: 0; }
.panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 16px;
}
.panel h2 { font-size: 19px; margin: 0 0 10px; }
.panel p { color: var(--muted); }
.search {
  width: 100%;
  border: 1px solid #dbe2e9;
  border-radius: 12px;
  padding: 13px 14px;
  background: white;
  color: var(--ink);
  margin: 8px 0 14px;
}
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filter-btn {
  background: white;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 12px;
  color: #637185;
  font-size: 12px;
  font-weight: 750;
}
.filter-btn.active { background: var(--green-soft); color: var(--green-dark); border-color: #cde5bd; }
.dictionary-item {
  padding: 17px 0;
  border-bottom: 1px solid #edf0f3;
}
.dictionary-item:last-child { border-bottom: 0; }
.dict-top { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
.dict-word { font-size: 17px; font-weight: 850; }
.dict-translation { margin: 4px 0; }
.dict-example { font-size: 13px; color: #5e7c50; margin: 8px 0; }
.audio-btn {
  flex: 0 0 auto;
  border: 1px solid var(--border);
  background: white;
  border-radius: 10px;
  padding: 7px 10px;
  color: #52657a;
}
.category-label { font-size: 10px; font-weight: 850; color: #738197; text-transform: uppercase; }
#lessonScreen { max-width: 790px; margin: auto; padding: 25px 22px 60px; }
.lesson-header { display: flex; align-items: center; gap: 13px; margin-bottom: 32px; }
.close-btn { border: 0; background: transparent; color: #7c8999; font-size: 25px; padding: 4px 8px; }
.lesson-bar { flex: 1; height: 7px; border-radius: 10px; background: #e8edf1; overflow: hidden; }
.lesson-bar div { height: 100%; background: var(--green); width: 0; transition: width .2s; }
.lesson-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
.question-type { color: var(--green-dark); font-size: 11px; font-weight: 850; letter-spacing: 1.2px; text-transform: uppercase; }
.question-title { font-size: clamp(23px, 4vw, 30px); line-height: 1.3; letter-spacing: -.5px; margin: 12px 0; }
.question-instruction { color: var(--muted); margin: 0 0 23px; }
.prompt-card {
  background: #f2f7ed;
  border: 1px solid #dcebd3;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
}
.prompt-german { font-size: 24px; font-weight: 850; line-height: 1.4; }
.prompt-translation { color: #657a5a; margin-top: 9px; }
.prompt-context { color: #657a5a; font-size: 13px; margin-top: 10px; }
.answer-list { display: grid; gap: 11px; }
.answer-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1.5px solid #dfe5eb;
  background: white;
  color: var(--ink);
  border-radius: 13px;
  padding: 14px;
  text-align: left;
  line-height: 1.5;
}
.answer-option:hover:not(:disabled) { border-color: #a6b9c8; background: #fbfcfe; }
.answer-option.selected { background: var(--blue-soft); border-color: var(--blue); }
.answer-option.correct { background: #eff8e9; border-color: #7eb55e; }
.answer-option.incorrect { background: var(--red-soft); border-color: #d87a81; }
.option-letter {
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  display: grid;
  place-items: center;
  border: 1px solid #dfe5eb;
  border-radius: 8px;
  font-weight: 850;
  color: #64758a;
}
.answer-option.correct .option-letter { background: var(--green); color: white; border-color: var(--green); }
.answer-option.incorrect .option-letter { background: var(--red); color: white; border-color: var(--red); }
.feedback {
  padding: 18px;
  border-radius: 14px;
  margin-top: 18px;
  line-height: 1.65;
}
.feedback.good { background: #eff8e9; border: 1px solid #d6e9c9; }
.feedback.bad { background: #fff5ed; border: 1px solid #f1ddcb; }
.feedback h3 { margin: 0 0 8px; font-size: 17px; }
.feedback p { margin: 8px 0; }
.feedback .explain { color: #46566a; }
.feedback .why { color: #647185; font-size: 13px; }
.lesson-footer {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}
.lesson-footer button { min-width: 145px; }
.completion { text-align: center; padding: 35px 10px; }
.completion-icon { font-size: 65px; }
.completion h1 { font-size: 30px; }
.completion p { color: var(--muted); line-height: 1.7; }
.interview-item {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  margin-bottom: 12px;
  overflow: hidden;
}
.interview-item summary { padding: 17px; cursor: pointer; font-weight: 800; line-height: 1.6; }
.interview-item summary:hover { background: #fafcf8; }
.interview-body { padding: 0 17px 17px; }
.interview-body p { line-height: 1.7; }
.model-answer { background: #f1f7ed; padding: 15px; border-radius: 12px; }
.model-answer p { color: #455c3b; margin-bottom: 0; }
.example-label { color: var(--green-dark); font-size: 11px; font-weight: 850; letter-spacing: .8px; }
.call-dialogue { display: grid; gap: 12px; }
.dialogue-line { padding: 15px; border: 1px solid var(--border); border-radius: 13px; }
.dialogue-line.agent { background: #f0f7ea; border-color: #dcebd3; }
.dialogue-line.customer { background: #f2f6fb; }
.dialogue-line strong { display: block; font-size: 12px; margin-bottom: 5px; }
.dialogue-line p { margin: 4px 0; }
.call-note { background: #fff8e9; border: 1px solid #f0e3c5; border-radius: 13px; padding: 16px; margin-top: 16px; }
.call-note strong { color: #92661c; }
.call-note p { color: #79694e; margin-bottom: 0; }
.empty-state { padding: 25px; text-align: center; color: var(--muted); }
.bottom-nav { display: none; }
@media(max-width: 900px) {
  .app-layout { grid-template-columns: 190px minmax(0, 740px); gap: 18px; }
}
@media(max-width: 650px) {
  .topbar { height: 62px; padding: 0 13px; }
  .brand { font-size: 18px; gap: 7px; }
  .brand-mark { width: 34px; height: 34px; font-size: 20px; }
  .header-note { display: none; }
  .app-layout { display: block; padding: 15px 12px 95px; }
  .sidebar { display: none; }
  .hero { padding: 22px 19px; }
  .hero h1 { font-size: 29px; }
  .hero-bottom { align-items: stretch; }
  .hero-bottom .primary { width: 100%; }
  .info-grid { grid-template-columns: 1fr; gap: 9px; }
  .info-tile { display: flex; gap: 12px; align-items: center; padding: 12px; }
  .info-tile strong { margin: 0; }
  .info-tile p { margin: 2px 0 0; }
  .module-card { gap: 11px; padding: 12px; }
  .module-icon { flex-basis: 43px; height: 43px; font-size: 22px; }
  .module-info strong { font-size: 14px; }
  .module-info p { font-size: 12px; }
  .module-arrow { font-size: 19px; }
  .module-meta .pill { font-size: 10px; }
  .section-heading h2 { font-size: 19px; }
  .panel { padding: 17px; }
  #lessonScreen { padding: 17px 13px 100px; }
  .lesson-header { gap: 8px; margin-bottom: 28px; }
  .question-title { font-size: 24px; }
  .prompt-card { padding: 18px; }
  .prompt-german { font-size: 22px; }
  .answer-option { padding: 12px; gap: 10px; }
  .lesson-footer { display: block; }
  .lesson-footer button { width: 100%; margin-top: 9px; }
  .bottom-nav {
    position: fixed;
    display: flex;
    left: 0; right: 0; bottom: 0;
    background: white;
    border-top: 1px solid var(--border);
    justify-content: space-around;
    padding: 7px 2px calc(7px + env(safe-area-inset-bottom));
    z-index: 25;
  }
  .bottom-nav button {
    border: 0; background: transparent; color: #7b8998;
    font-size: 10px; font-weight: 800; padding: 4px 7px;
    min-width: 60px;
  }
  .bottom-nav button span { display: block; font-size: 21px; margin-bottom: 2px; }
  .bottom-nav button.active { color: var(--green-dark); }
}
@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark">D</div> DeutschQuest</div>
  <div class="header-note">Deutsch für Kundenservice · Deutsch–Shqip</div>
</header>

<div class="app-layout" id="appLayout">
  <aside class="sidebar">
    <div class="nav-label">MËSIMI</div>
    <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span> Mësimet</button>
    <button class="nav-btn" data-page="dictionary"><span class="nav-icon">▤</span> Fjalori</button>
    <button class="nav-btn" data-page="practice"><span class="nav-icon">☎</span> Bisedat praktike</button>
    <button class="nav-btn" data-page="interview"><span class="nav-icon">▣</span> Intervista</button>
    <div class="sidebar-note">
      <strong>🎯 Qëllimi yt</strong>
      <p>Mëso shprehje profesionale dhe kupto pse përdoren. Praktikoji me zë përpara një interviste.</p>
    </div>
  </aside>

  <main id="content"></main>
</div>

<section id="lessonScreen" class="hidden">
  <div class="lesson-header">
    <button id="closeLesson" class="close-btn" aria-label="Mbyll mësimin">×</button>
    <div class="lesson-bar"><div id="lessonBarFill"></div></div>
    <span class="lesson-count" id="lessonCount"></span>
  </div>
  <div id="questionArea"></div>
</section>

<nav class="bottom-nav" aria-label="Navigimi kryesor">
  <button class="active" data-page="home"><span>⌂</span>Mësimet</button>
  <button data-page="dictionary"><span>▤</span>Fjalori</button>
  <button data-page="practice"><span>☎</span>Bisedat</button>
  <button data-page="interview"><span>▣</span>Intervista</button>
</nav>

<script>
"use strict";

/* =====================================================
   PYETJET
   Çdo pyetje e ka përgjigjen e saktë të shënuar veçmas.
   Alternativat mund të përzihen pa prishur kontrollin.
===================================================== */
const modules = [
{
 id:"basics", title:"Bazat e Kundenservice",
 subtitle:"Përshëndetje, mirësjellje dhe telefonata",
 icon:"👋", color:"#e4f2ff", level:"A2",
 questions:[
  {
   prompt:"Cila është mënyra më profesionale për ta nisur një telefonatë me klientin?",
   context:"Ti je agjenti që po e pranon telefonatën.",
   options:[
    "Guten Tag, wie kann ich Ihnen helfen?",
    "Hallo, was willst du?",
    "Ja, was gibt's?"
   ],
   correct:"Guten Tag, wie kann ich Ihnen helfen?",
   translation:"Mirëdita, si mund t'ju ndihmoj?",
   explanation:"Kjo është një hyrje e sjellshme dhe profesionale. 'Ihnen' është forma formale e 'ju' në rasën dhanore. Në shërbimin ndaj klientit, zakonisht përdoret 'Sie/Ihnen', përveç nëse kompania ka një stil komunikimi joformal.",
   distractors:{
    "Hallo, was willst du?":"'Du' është joformale, ndërsa 'was willst du?' mund të tingëllojë e vrazhdë ndaj një klienti të panjohur.",
    "Ja, was gibt's?":"Është bisedore dhe mund të tingëllojë tepër e drejtpërdrejtë për një përshëndetje profesionale."
   }
  },
  {
   prompt:"Klienti të kërkon ta presë për pak. Çfarë thua kur duhet të kontrollosh një informacion?",
   context:"Duhet ta kontrollosh llogarinë para se të përgjigjesh.",
   options:[
    "Einen Moment bitte, ich prüfe das für Sie.",
    "Warten. Ich weiß es nicht.",
    "Rufen Sie später wieder an."
   ],
   correct:"Einen Moment bitte, ich prüfe das für Sie.",
   translation:"Një moment, ju lutem, po e kontrolloj për ju.",
   explanation:"Fjalia e informon klientin se çfarë po bën. 'Ich prüfe das für Sie' tregon se po e kontrollon çështjen në interes të klientit.",
   distractors:{
    "Warten. Ich weiß es nicht.":"Është e prerë dhe nuk e informon klientin se çfarë do të bësh për ta zgjidhur çështjen.",
    "Rufen Sie später wieder an.":"E dërgon klientin të telefonojë përsëri pa kontrolluar nëse kjo është e nevojshme."
   }
  },
  {
   prompt:"Cila formë përdoret zakonisht për t'iu drejtuar me mirësjellje një klienti?",
   context:"Zgjidh fjalën që plotëson fjalinë: 'Kann ich ___ helfen?'",
   options:["dir","Ihnen","du"],
   correct:"Ihnen",
   translation:"A mund t'ju ndihmoj?",
   explanation:"Folja 'helfen' kërkon rasën dhanore. Forma formale është 'Ihnen': 'Kann ich Ihnen helfen?'",
   distractors:{
    "dir":"'Dir' është forma joformale e dhanore për 'du'.",
    "du":"'Du' është përemër i rasës emërore dhe nuk përshtatet pas 'helfen' në këtë fjali."
   }
  },
  {
   prompt:"Nuk e ke kuptuar një pjesë të asaj që tha klienti. Si kërkon përsëritje?",
   options:[
    "Könnten Sie das bitte wiederholen?",
    "Was? Sprechen Sie richtig!",
    "Ich habe nicht zugehört."
   ],
   correct:"Könnten Sie das bitte wiederholen?",
   translation:"A mund ta përsërisni këtë, ju lutem?",
   explanation:"'Könnten Sie ... bitte?' është mënyrë e sjellshme për të kërkuar diçka. Është e pranueshme të kërkosh sqarim kur nuk e ke kuptuar informacionin.",
   distractors:{
    "Was? Sprechen Sie richtig!":"Tingëllon akuzuese dhe mund ta bëjë klientin të ndihet i kritikuar.",
    "Ich habe nicht zugehört.":"'Nuk kam dëgjuar' mund të lërë përshtypjen se nuk i ke kushtuar vëmendje klientit."
   }
  },
  {
   prompt:"Cila shprehje është më e përshtatshme për ta mbyllur një telefonatë?",
   options:[
    "Vielen Dank für Ihren Anruf. Auf Wiederhören!",
    "Okay, tschüss.",
    "So, fertig. Weg damit."
   ],
   correct:"Vielen Dank für Ihren Anruf. Auf Wiederhören!",
   translation:"Faleminderit për telefonatën. Mirë u dëgjofshim!",
   explanation:"'Auf Wiederhören' përdoret për përfundimin e telefonatave. Falënderimi dhe përshëndetja përfundimtare krijojnë një përshtypje profesionale.",

/* =====================================================
   GJENDJA E APLIKACIONIT
===================================================== */
const content = document.getElementById("content");
const lessonScreen = document.getElementById("lessonScreen");
const questionArea = document.getElementById("questionArea");

let activePage = "home";
let activeModule = null;
let questionOrder = [];
let questionIndex = 0;
let chosenAnswer = null;
let answerChecked = false;
let activeOptions = [];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function button(text, className, handler) {
  const b = el("button", className, text);
  b.type = "button";
  b.addEventListener("click", handler);
  return b;
}
function shuffle(items) {
  const result = items.slice();
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function setNavigation(page) {
  activePage = page;
  document.querySelectorAll("[data-page]").forEach(b => {
    b.classList.toggle("active", b.dataset.page === page);
  });
}
function showPage(page) {
  setNavigation(page);
  lessonScreen.classList.add("hidden");
  document.getElementById("appLayout").classList.remove("hidden");
  document.querySelector(".bottom-nav").classList.remove("hidden");

  if (page === "home") renderHome();
  if (page === "dictionary") renderDictionary();
  if (page === "practice") renderPractice();
  if (page === "interview") renderInterview();
}
function startModule(id) {
  activeModule = modules.find(m => m.id === id);
  if (!activeModule || !activeModule.questions.length) return;

  questionOrder = shuffle(activeModule.questions.map((_, i) => i));
  questionIndex = 0;
  chosenAnswer = null;
  answerChecked = false;

  document.getElementById("appLayout").classList.add("hidden");
  lessonScreen.classList.remove("hidden");
  document.querySelector(".bottom-nav").classList.add("hidden");
  renderQuestion();
}
function closeLesson() {
  lessonScreen.classList.add("hidden");
  document.getElementById("appLayout").classList.remove("hidden");
  document.querySelector(".bottom-nav").classList.remove("hidden");
  showPage("home");
}
function currentQuestion() {
  return activeModule.questions[questionOrder[questionIndex]];
}

/* =====================================================
   TESTI — kontrolli bazohet te fusha "correct".
   Nuk varet nga renditja e alternativave.
===================================================== */
function renderQuestion() {
  chosenAnswer = null;
  answerChecked = false;
  const q = currentQuestion();
  const total = questionOrder.length;

  document.getElementById("lessonBarFill").style.width =
    (questionIndex / total * 100) + "%";
  document.getElementById("lessonCount").textContent =
    (questionIndex + 1) + " / " + total;

  questionArea.replaceChildren();

  questionArea.appendChild(el("div", "question-type",
    activeModule.title + " · NIVELI " + activeModule.level));
  questionArea.appendChild(el("h1", "question-title", q.prompt));
  if (q.context) questionArea.appendChild(el("p", "question-instruction", q.context));
  else questionArea.appendChild(el("p", "question-instruction",
    "Zgjidh përgjigjen më të përshtatshme. Shiko shpjegimin pas kontrollimit."));

  const prompt = el("div", "prompt-card");
  if (q.translation) {
    prompt.appendChild(el("div", "prompt-german", q.translation));
  } else {
    prompt.appendChild(el("div", "prompt-german", "Wähle die richtige Antwort."));
  }
  if (q.context) prompt.appendChild(el("div", "prompt-context", q.context));
  questionArea.appendChild(prompt);

  const answers = el("div", "answer-list");
  answers.id = "answerList";
  activeOptions = shuffle(q.options);

  activeOptions.forEach((option, i) => {
    const b = el("button", "answer-option");
    b.type = "button";
    b.appendChild(el("span", "option-letter", String.fromCharCode(65 + i)));
    b.appendChild(el("span", "", option));
    b.addEventListener("click", () => {
      if (answerChecked) return;
      chosenAnswer = option;
      answers.querySelectorAll(".answer-option").forEach(item => {
        item.classList.remove("selected");
      });
      b.classList.add("selected");
      document.getElementById("checkAnswer").disabled = false;
    });
    answers.appendChild(b);
  });
  questionArea.appendChild(answers);

  const feedback = el("div", "");
  feedback.id = "answerFeedback";
  questionArea.appendChild(feedback);

  const footer = el("div", "lesson-footer");
  footer.appendChild(button("Mbyll mësimin", "outline", closeLesson));
  const check = button("Kontrollo përgjigjen", "primary", checkAnswer);
  check.id = "checkAnswer";
  check.disabled = true;
  footer.appendChild(check);
  questionArea.appendChild(footer);
}

function checkAnswer() {
  const q = currentQuestion();
  const checkButton = document.getElementById("checkAnswer");

  if (answerChecked) {
    questionIndex++;
    if (questionIndex >= questionOrder.length) {
      renderCompletion();
    } else {
      renderQuestion();
    }
    return;
  }
  if (chosenAnswer === null) return;

  answerChecked = true;
  const correct = chosenAnswer === q.correct;
  const buttons = document.querySelectorAll("#answerList .answer-option");

  buttons.forEach(b => {
    b.disabled = true;
    const text = b.lastElementChild.textContent;
    if (text === q.correct) b.classList.add("correct");
    if (text === chosenAnswer && !correct) b.classList.add("incorrect");
  });

  const feedback = document.getElementById("answerFeedback");
  feedback.className = "feedback " + (correct ? "good" : "bad");

  feedback.appendChild(el("h3", "", correct
    ? "Përgjigjja është e saktë"
    : "Përgjigjja nuk është e saktë"));

  feedback.appendChild(el("p", "explain",
    "Përgjigjja e saktë: " + q.correct));

  feedback.appendChild(el("p", "explain", q.explanation));

  if (!correct && q.distractors && q.distractors[chosenAnswer]) {
    feedback.appendChild(el("p", "why",
      "Pse alternativa jote nuk përshtatet: " + q.distractors[chosenAnswer]));
  }

  if (correct) {
    feedback.appendChild(el("p", "why",
      "Këshillë: thuaje shprehjen me zë dhe provo ta përdorësh në një fjali tjetër."));
  }

  checkButton.textContent = questionIndex === questionOrder.length - 1
    ? "Përfundo mësimin"
    : "Pyetja tjetër →";
  checkButton.disabled = false;
}
function renderCompletion() {
  document.getElementById("lessonBarFill").style.width = "100%";
  document.getElementById("lessonCount").textContent = "Përfunduar";
  questionArea.replaceChildren();

  const wrap = el("div", "completion");
  wrap.appendChild(el("div", "completion-icon", "📘"));
  wrap.appendChild(el("div", "eyebrow", "MËSIMI U PËRFUNDUA"));
  wrap.appendChild(el("h1", "", "Sehr gut!"));
  wrap.appendChild(el("p", "",
    "E përfundove modulin \"" + activeModule.title + "\". Përsëriti shprehjet që të duken të vështira dhe provo t'i thuash me zë."));
  wrap.appendChild(button("Kthehu te të gjitha mësimet", "primary full", closeLesson));
  wrap.appendChild(document.createElement("br"));
  wrap.appendChild(document.createElement("br"));

  const next = modules.find(m => m.id !== activeModule.id);
  if (next) {
    wrap.appendChild(button("Vazhdo te " + next.title, "secondary full", () => startModule(next.id)));
  }
  questionArea.appendChild(wrap);
}

/* =====================================================

function renderDictionary() {
  content.replaceChildren();

  const heading = el("div", "page-heading");

  heading.appendChild(el("h1", "", "Fjalori i Kundenservice"));
  heading.appendChild(el("p", "",
    "Kërko fjalë gjermanisht ose shqip. Mëso kuptimin dhe shembullin në kontekst."));
  content.appendChild(heading);

  const panel = el("section", "panel");
  const search = el("input", "search");
  search.type = "search";
  search.placeholder = "🔎 Kërko fjalë, përkthim ose shembull...";
  search.setAttribute("aria-label", "Kërko në fjalor");
  panel.appendChild(search);

  const categories = ["Të gjitha", ...new Set(dictionary.map(d => d[3]))];
  const filters = el("div", "filters");
  let selectedCategory = "Të gjitha";

  categories.forEach(cat => {
    const b = button(cat, "filter-btn" + (cat === selectedCategory ? " active" : ""), () => {
      selectedCategory = cat;
      filters.querySelectorAll("button").forEach(x => x.classList.toggle("active", x.textContent === cat));
      renderResults();
    });
    filters.appendChild(b);
  });
  panel.appendChild(filters);

  const count = el("p", "");
  count.style.fontSize = "12px";
  count.style.margin = "0 0 6px";
  panel.appendChild(count);

  const results = el("div", "");
  panel.appendChild(results);
  content.appendChild(panel);

  function renderResults() {
    results.replaceChildren();
    const term = search.value.trim().toLocaleLowerCase("de");
    const filtered = dictionary.filter(d => {
      const matchesText = d.join(" ").toLocaleLowerCase("de").includes(term);
      const matchesCategory = selectedCategory === "Të gjitha" || d[3] === selectedCategory;
      return matchesText && matchesCategory;
    });
    count.textContent = "U gjetën " + filtered.length + " fjalë.";

    if (!filtered.length) {
      results.appendChild(el("div", "empty-state",
        "Nuk u gjet asnjë rezultat. Provo një fjalë tjetër."));
      return;
    }

    filtered.forEach(d => {
      const item = el("article", "dictionary-item");
      const top = el("div", "dict-top");
      const wordBox = el("div", "");
      wordBox.appendChild(el("div", "category-label", d[3]));
      wordBox.appendChild(el("div", "dict-word", d[0]));
      top.appendChild(wordBox);
      top.appendChild(button("🔊", "audio-btn", () => speak(d[0])));
      item.appendChild(top);
      item.appendChild(el("p", "dict-translation", d[1]));
      item.appendChild(el("p", "dict-example", "„" + d[2] + "“"));
      item.appendChild(button("Dëgjo shembullin", "secondary", () => speak(d[2])));
      results.appendChild(item);
    });
  }
  search.addEventListener("input", renderResults);
  renderResults();
}

/* =====================================================
   SHQIPTIMI
===================================================== */
function speak(text) {
  if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
    alert("Shqiptimi automatik nuk mbështetet nga ky shfletues. Mund ta lexosh tekstin në ekran.");
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "de-DE";
  utterance.rate = 0.86;

  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang.toLowerCase().startsWith("de"));
  if (voice) utterance.voice = voice;

  window.speechSynthesis.speak(utterance);
}

/* =====================================================
   KONTROLLE AUTOMATIKE TË KONSISTENCËS
   Kontrollon që çdo pyetje ka alternativë të saktë
   dhe që ajo gjendet mes alternativave.
===================================================== */
function validateQuestions() {
  const errors = [];
  modules.forEach(module => {
    module.questions.forEach((q, index) => {
      const prefix = module.id + " / pyetja " + (index + 1);
      if (!Array.isArray(q.options) || q.options.length < 2) {
        errors.push(prefix + ": mungojnë alternativat.");
      }
      if (!q.options.includes(q.correct)) {
        errors.push(prefix + ": përgjigjja e saktë nuk gjendet te alternativat.");
      }
      if (new Set(q.options).size !== q.options.length) {
        errors.push(prefix + ": ka alternativa të përsëritura.");
      }
      if (!q.explanation || !q.translation) {
        errors.push(prefix + ": mungon shpjegimi ose përkthimi.");
      }
    });
  });
  return errors;
}

document.getElementById("closeLesson").addEventListener("click", closeLesson);

const validationErrors = validateQuestions();
if (validationErrors.length) {
  content.replaceChildren();
  const errorPanel = el("section", "panel");
  errorPanel.appendChild(el("h2", "", "Ka gabime në përmbajtjen e mësimeve"));
  validationErrors.forEach(message => errorPanel.appendChild(el("p", "", message)));

} else {

}
